<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You! - Al Risha Scientific Center</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="WhatsApp Image 2026-03-17 at 4.09.35 PM.jpeg">
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 2rem;
        }
        .thanks-container {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(30px);
            border-radius: 24px;
            padding: 4rem 3rem;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.8);
        }
        .thanks-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            color: #10b981;
        }
        h1 {
            font-size: 2.5rem;
            color: #1f2937;
            margin-bottom: 1rem;
        }
        p {
            color: #6b7280;
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        .back-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 1.2rem 3rem;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 10px 25px rgba(37,99,235,0.4);
        }
        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(37,99,235,0.5);
        }
    </style>
</head>
<body>
    <div class="thanks-container">
        <div class="thanks-icon">✅</div>
        <h1>Thank You for Your Message!</h1>
        <p>Your request has been sent successfully.<br>
        Our team will respond to you as soon as possible.</p>
        <a href="index.html" class="back-btn">← Back to Home</a>
    </div>
</body>
</html>
